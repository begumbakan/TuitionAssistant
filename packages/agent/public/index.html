<!doctype html>
<html><head><meta charset="utf-8"><title>AI Tuition Assistant</title>
<style>
 body{font-family:system-ui,sans-serif;max-width:760px;margin:24px auto;padding:0 12px}
 #log{border:1px solid #ccc;border-radius:8px;padding:12px;height:440px;overflow:auto;background:#fafafa}
 .u{text-align:right;margin:8px 0}.u span{background:#2563eb;color:#fff;padding:6px 10px;border-radius:10px;display:inline-block;white-space:pre-wrap}
 .a{margin:8px 0}.a .msg{background:#fff;border:1px solid #ddd;padding:6px 10px;border-radius:10px;display:inline-block;line-height:1.45}
 .a .msg ul{margin:4px 0;padding-left:20px}.a .msg code{background:#f1f1f1;padding:0 3px;border-radius:3px}
 .thinking{color:#888;font-style:italic}
 details{font-size:12px;color:#555;margin:2px 0 8px}pre{white-space:pre-wrap;margin:0}
 form{display:flex;gap:8px;margin-top:8px}input{flex:1;padding:8px}
</style></head><body>
<h2>AI Tuition Assistant</h2>
<form id="lf"><input id="u" placeholder="Student no (e.g. 23070000101)"><input id="p" type="password" placeholder="Password"><button>Login</button></form>
<div id="log"></div>
<form id="cf"><input id="m" placeholder="Ask about deadlines, your balance, installments, or pay..." disabled><button>Send</button></form>
<script>
let sid=null;const log=document.getElementById('log');
const add=(cls,html)=>{const d=document.createElement('div');d.className=cls;d.innerHTML=html;log.appendChild(d);log.scrollTop=1e9;return d};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Minimal, safe markdown: text is HTML-escaped FIRST, then only **bold**, *italic*, `code` and "* "/"- " bullets are turned into tags.
function md(text){
  const inline=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g,'$1<em>$2</em>').replace(/`([^`]+)`/g,'<code>$1</code>');
  let html='',inList=false;
  for(const line of String(text).split('\n')){
    const b=/^\s*[*-]\s+(.*)$/.exec(line);
    if(b){ if(!inList){html+='<ul>';inList=true} html+='<li>'+inline(b[1])+'</li>'; continue; }
    if(inList){html+='</ul>';inList=false}
    html+=line.trim()===''?'<br>':inline(line)+'<br>';
  }
  if(inList)html+='</ul>';
  return html.replace(/(<br>)+$/,'');
}

lf.onsubmit=async e=>{e.preventDefault();const r=await fetch('/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});const j=await r.json();
 if(!r.ok)return add('a','<span class="msg">Login failed: '+esc(j.error)+'</span>');sid=j.sessionId;m.disabled=false;add('a','<span class="msg">Logged in as '+esc(j.studentNo)+'</span>')};
cf.onsubmit=async e=>{e.preventDefault();const q=m.value.trim();if(!q)return;m.value='';add('u','<span>'+esc(q)+'</span>');
 const wait=add('a thinking','Thinking…');m.disabled=true;
 try{
  const r=await fetch('/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sessionId:sid,message:q})});const j=await r.json();
  wait.remove();
  for(const t of j.trace||[])add('','<details><summary>tool: '+esc(t.tool)+'</summary><pre>input: '+esc(JSON.stringify(t.input))+'\nresult: '+esc(JSON.stringify(t.result,null,1))+'</pre></details>');
  add('a','<span class="msg">'+md(j.reply||j.error)+'</span>');
 }catch(err){wait.remove();add('a','<span class="msg">Network error: '+esc(err.message)+'</span>')}
 finally{m.disabled=false;m.focus()}};
</script></body></html>
